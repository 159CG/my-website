<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<title>中华锦绣 · 民族文化长廊 | 全屏轮播</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
				overflow: hidden;
				height: 100vh;
				width: 100vw;
				background: #1a1a2e;
			}

			/* 全屏轮播容器 */
			.fullscreen-carousel {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: #000;
				z-index: 1;
			}

			/* 轮播图容器 */
			.carousel-container {
				position: relative;
				width: 100%;
				height: 100%;
				overflow: hidden;
			}

			/* 轮播图轨道 */
			.carousel-track {
				display: flex;
				width: 100%;
				height: 100%;
				transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
			}

			/* 每一张轮播图 */
			.carousel-slide {
				flex-shrink: 0;
				width: 100%;
				height: 100%;
				position: relative;
			}

			.carousel-slide img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				filter: brightness(0.85);
			}

			/* 文字遮罩层 */
			.slide-caption {
				position: absolute;
				bottom: 0;
				left: 0;
				right: 0;
				background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
				padding: 60px 40px 40px;
				color: white;
				text-align: center;
			}

			.slide-title {
				font-size: 48px;
				font-weight: 700;
				letter-spacing: 4px;
				margin-bottom: 12px;
				text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
			}

			.slide-subtitle {
				font-size: 18px;
				opacity: 0.9;
				letter-spacing: 2px;
			}

			.slide-desc {
				font-size: 14px;
				opacity: 0.75;
				margin-top: 16px;
				max-width: 600px;
				margin-left: auto;
				margin-right: auto;
				line-height: 1.6;
			}

			/* 导航按钮 */
			.carousel-btn {
				position: absolute;
				top: 50%;
				transform: translateY(-50%);
				width: 50px;
				height: 50px;
				background: rgba(255, 255, 255, 0.2);
				backdrop-filter: blur(8px);
				border: none;
				border-radius: 50%;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				transition: all 0.3s ease;
				z-index: 20;
				color: white;
				font-size: 28px;
				font-weight: 300;
			}

			.carousel-btn:hover {
				background: rgba(212, 76, 47, 0.7);
				transform: translateY(-50%) scale(1.1);
			}

			.btn-prev {
				left: 30px;
			}

			.btn-next {
				right: 30px;
			}

			/* 底部指示器 */
			.carousel-dots {
				position: absolute;
				bottom: 30px;
				left: 0;
				right: 0;
				display: flex;
				justify-content: center;
				gap: 12px;
				z-index: 20;
			}

			.dot {
				width: 10px;
				height: 10px;
				border-radius: 50%;
				background: rgba(255, 255, 255, 0.5);
				cursor: pointer;
				transition: all 0.3s ease;
			}

			.dot.active {
				width: 28px;
				border-radius: 10px;
				background: #d44c2f;
			}

			.dot:hover {
				background: rgba(255, 255, 255, 0.9);
			}

			/* 顶部标题栏 */
			.top-bar {
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				padding: 20px 40px;
				display: flex;
				justify-content: space-between;
				align-items: center;
				z-index: 20;
				background: linear-gradient(to bottom, rgba(0, 0, 0, 0.5), transparent);
				pointer-events: none;
			}

			.logo-area {
				display: flex;
				align-items: center;
				gap: 12px;
				pointer-events: auto;
			}

			.logo-icon svg {
				filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
			}

			.logo-text {
				color: white;
				font-size: 18px;
				font-weight: 600;
				letter-spacing: 2px;
				text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
			}

			.logo-text small {
				font-size: 12px;
				font-weight: normal;
				opacity: 0.8;
			}

			.time-display {
				color: white;
				font-size: 14px;
				background: rgba(0, 0, 0, 0.4);
				backdrop-filter: blur(4px);
				padding: 6px 14px;
				border-radius: 30px;
				letter-spacing: 1px;
				pointer-events: auto;
				font-family: monospace;
			}

			/* 底部进度条 */
			.progress-bar {
				position: absolute;
				bottom: 0;
				left: 0;
				height: 3px;
				background: #d44c2f;
				width: 0%;
				transition: width 0.1s linear;
				z-index: 20;
			}

			/* 入场动画 */
			.carousel-slide {
				animation: fadeIn 0.8s ease;
			}

			@keyframes fadeIn {
				from {
					opacity: 0;
					transform: scale(1.05);
				}

				to {
					opacity: 1;
					transform: scale(1);
				}
			}

			/* 响应式调整 */
			@media (max-width: 768px) {
				.slide-title {
					font-size: 28px;
				}

				.slide-subtitle {
					font-size: 14px;
				}

				.slide-desc {
					font-size: 12px;
					padding: 0 20px;
				}

				.carousel-btn {
					width: 40px;
					height: 40px;
					font-size: 20px;
				}

				.btn-prev {
					left: 15px;
				}

				.btn-next {
					right: 15px;
				}

				.top-bar {
					padding: 15px 20px;
				}

				.logo-text {
					font-size: 14px;
				}

				.logo-text small {
					display: none;
				}
			}

			/* 键盘提示 */
			.keyboard-hint {
				position: absolute;
				bottom: 80px;
				right: 20px;
				background: rgba(0, 0, 0, 0.5);
				backdrop-filter: blur(4px);
				padding: 6px 12px;
				border-radius: 20px;
				font-size: 11px;
				color: rgba(255, 255, 255, 0.6);
				z-index: 20;
				font-family: monospace;
				pointer-events: none;
			}
		</style>
	</head>
	<body>

		<div class="fullscreen-carousel">
			<div class="top-bar">
				<div class="logo-area">
					<div class="logo-icon">
						<svg width="36" height="36" viewBox="0 0 48 48" fill="none">
							<circle cx="24" cy="24" r="20" fill="#d44c2f" stroke="#ffcd94" stroke-width="2" />
							<path d="M16 20 L24 12 L32 20 L28 28 L20 28 L16 20Z" fill="#FFE6C7" stroke="#aa2e1e"
								stroke-width="1.5" />
							<circle cx="24" cy="20" r="2" fill="#d44c2f" />
						</svg>
					</div>
					<div class="logo-text">
						中华锦绣·民族文化长廊<br><small>56个民族 56枝花</small>
					</div>
				</div>
				<div class="time-display" id="currentTime"></div>
			</div>

			<div class="carousel-container">
				<div class="carousel-track" id="carouselTrack">
					<!-- 轮播图会通过 JavaScript 动态生成，图片路径已全部使用拼音命名 -->
				</div>

				<button class="carousel-btn btn-prev" id="prevBtn">❮</button>
				<button class="carousel-btn btn-next" id="nextBtn">❯</button>

				<div class="carousel-dots" id="carouselDots"></div>
				<div class="progress-bar" id="progressBar"></div>
				<div class="keyboard-hint">← / → 切换 | 自动轮播</div>
			</div>
		</div>

		<script>
			// ==================== 轮播图数据配置 ====================
			const slidesData = [{
					id: 1,
					title: "我们的民族",
					subtitle: "伟大的中华民族",
					desc: "世界上历史最悠久、文明最灿烂、生命力最顽强的民族之一 。",
					image: "img/minzutuanjie.png",
					tags: "源远流长 · 自强不息 · 厚德载物 · 屹立东方"
				},
				{
					id: 2,
					title: "蒙古族",
					subtitle: "草原游牧民族",
					desc: "那达慕大会、马头琴、长调民歌享誉世界。",
					image: "img/mengguzu.jpg",
					tags: "那达慕 · 马头琴 · 草原"
				},
				{
					id: 3,
					title: "回族",
					subtitle: "分布最广的少数民族",
					desc: "清真饮食文化，开斋节、古尔邦节重要节日。",
					image: "img/huizu.jpg",
					tags: "开斋节 · 花儿 · 清真美食"
				},
				{
					id: 4,
					title: "藏族",
					subtitle: "雪域高原的守护者",
					desc: "藏传佛教文化，唐卡艺术，雪顿节盛大。",
					image: "img/zangzu.png",
					tags: "雪顿节 · 唐卡 · 藏传佛教"
				},
				{
					id: 5,
					title: "维吾尔族",
					subtitle: "歌舞之乡",
					desc: "十二木卡姆被誉为东方音乐瑰宝。",
					image: "img/weiwuerzu.webp",
					tags: "木卡姆 · 手抓饭 · 歌舞之乡"
				},
				{
					id: 6,
					title: "苗族",
					subtitle: "银饰之魂",
					desc: "银饰精美，刺绣技艺高超，芦笙舞欢快热烈。",
					image: "img/miaozu.jpg",
					tags: "银饰 · 苗绣 · 芦笙"
				},
				{
					id: 7,
					title: "彝族",
					subtitle: "火把之光",
					desc: "火把节闻名遐迩，十月太阳历独特，漆器工艺精湛。",
					image: "img/yizu.jfif",
					tags: "火把节 · 漆器 · 十月太阳历"
				},
				{
					id: 8,
					title: "壮族",
					subtitle: "歌海壮乡",
					desc: "三月三歌圩节，铜鼓文化深厚。",
					image: "img/zhuangzu.webp",
					tags: "三月三 · 铜鼓 · 壮锦"
				}
			];

			// ==================== 轮播图逻辑 ====================
			let currentIndex = 0;
			let slidesCount = slidesData.length;
			let autoTimer = null;
			let progressInterval = null;
			let isTransitioning = false;
			const AUTO_INTERVAL = 5000; // 5秒自动切换

			// DOM 元素
			const track = document.getElementById('carouselTrack');
			const dotsContainer = document.getElementById('carouselDots');
			const prevBtn = document.getElementById('prevBtn');
			const nextBtn = document.getElementById('nextBtn');
			const progressBar = document.getElementById('progressBar');

			// 生成轮播图 HTML
			function renderSlides() {
				track.innerHTML = '';
				dotsContainer.innerHTML = '';

				slidesData.forEach((slide, idx) => {
					// 创建 slide
					const slideDiv = document.createElement('div');
					slideDiv.className = 'carousel-slide';
					// 添加图片，如果加载失败则使用高质量占位图 (保留了原始民族文化的氛围图)
					slideDiv.innerHTML = `
                <img src="${slide.image}" alt="${slide.title}" onerror="this.src='https://picsum.photos/id/104/1920/1080'">
                <div class="slide-caption">
                    <div class="slide-title">${slide.title}</div>
                    <div class="slide-subtitle">${slide.subtitle}</div>
                    <div class="slide-desc">${slide.desc}</div>
                </div>
            `;
					track.appendChild(slideDiv);

					// 创建圆点
					const dot = document.createElement('div');
					dot.className = 'dot';
					dot.dataset.index = idx;
					dot.addEventListener('click', () => goToSlide(idx));
					dotsContainer.appendChild(dot);
				});

				updateDots();
			}

			// 更新圆点状态
			function updateDots() {
				const dots = document.querySelectorAll('.dot');
				dots.forEach((dot, idx) => {
					if (idx === currentIndex) {
						dot.classList.add('active');
					} else {
						dot.classList.remove('active');
					}
				});
			}

			// 切换到指定 slide
			function goToSlide(index, shouldResetTimer = true) {
				if (isTransitioning) return;
				if (index < 0) index = slidesCount - 1;
				if (index >= slidesCount) index = 0;
				if (index === currentIndex) return;

				isTransitioning = true;
				currentIndex = index;

				// 移动轨道
				track.style.transform = `translateX(-${currentIndex * 100}%)`;

				// 更新圆点
				updateDots();

				// 重置自动轮播计时器
				if (shouldResetTimer) {
					resetAutoTimer();
				}

				// 动画结束后解锁
				setTimeout(() => {
					isTransitioning = false;
				}, 600);
			}

			// 下一张
			function nextSlide() {
				goToSlide(currentIndex + 1);
			}

			// 上一张
			function prevSlide() {
				goToSlide(currentIndex - 1);
			}

			// 重置自动轮播计时器
			function resetAutoTimer() {
				if (autoTimer) {
					clearTimeout(autoTimer);
					autoTimer = null;
				}
				if (progressInterval) {
					clearInterval(progressInterval);
					progressInterval = null;
				}

				// 重置进度条
				progressBar.style.width = '0%';

				// 启动新的计时器
				autoTimer = setTimeout(() => {
					nextSlide();
				}, AUTO_INTERVAL);

				// 启动进度条动画
				let startTime = Date.now();
				progressInterval = setInterval(() => {
					const elapsed = Date.now() - startTime;
					const percent = (elapsed / AUTO_INTERVAL) * 100;
					if (percent >= 100) {
						clearInterval(progressInterval);
						progressInterval = null;
						progressBar.style.width = '0%';
					} else {
						progressBar.style.width = `${percent}%`;
					}
				}, 50);
			}

			// 初始化轮播
			function initCarousel() {
				renderSlides();

				// 设置初始位置
				track.style.transform = `translateX(0%)`;

				// 绑定事件
				prevBtn.addEventListener('click', () => {
					prevSlide();
					resetAutoTimer();
				});
				nextBtn.addEventListener('click', () => {
					nextSlide();
					resetAutoTimer();
				});

				// 键盘控制
				document.addEventListener('keydown', (e) => {
					if (e.key === 'ArrowLeft') {
						prevSlide();
						resetAutoTimer();
					} else if (e.key === 'ArrowRight') {
						nextSlide();
						resetAutoTimer();
					}
				});

				// 鼠标悬停时暂停自动轮播
				const container = document.querySelector('.carousel-container');
				container.addEventListener('mouseenter', () => {
					if (autoTimer) {
						clearTimeout(autoTimer);
						autoTimer = null;
					}
					if (progressInterval) {
						clearInterval(progressInterval);
						progressInterval = null;
					}
				});
				container.addEventListener('mouseleave', () => {
					resetAutoTimer();
				});

				// 启动自动轮播
				resetAutoTimer();
			}

			// 更新时间显示
			function updateTime() {
				const now = new Date();
				const year = now.getFullYear();
				const month = String(now.getMonth() + 1).padStart(2, '0');
				const day = String(now.getDate()).padStart(2, '0');
				const hours = String(now.getHours()).padStart(2, '0');
				const minutes = String(now.getMinutes()).padStart(2, '0');
				const seconds = String(now.getSeconds()).padStart(2, '0');
				document.getElementById('currentTime').textContent = `${year}.${month}.${day} ${hours}:${minutes}:${seconds}`;
			}

			// 启动时间
			updateTime();
			setInterval(updateTime, 1000);

			// 页面加载完成后初始化轮播
			window.addEventListener('DOMContentLoaded', () => {
				initCarousel();
			});
		</script>
	</body>
</html>
